{% extends "admin/base.html" %}

{% block title %}{{ title }} | RankJee Admin{% endblock %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">RankJee Control Centre</a></h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    :root {
        --primary: #000000;
        --secondary: #2d0000;
        --header-bg: #000000;
        --header-color: #ffffff;
        --header-link-color: #ff4d4d;
        --branding-color: #ffffff;
        --link-color: #ff4d4d;
        --link-hover-color: #ff0000;
        --link-selected-color: #ff4d4d;
        --button-bg: #8b0000;
        --button-hover-bg: #4d0000;
        --default-button-bg: #333333;
        --default-button-hover-bg: #111111;
        --close-button-bg: #888;
        --close-button-hover-bg: #444;
        --delete-button-bg: #ba2121;
        --delete-button-hover-bg: #a41515;
        --object-tools-bg: #8b0000;
        --object-tools-hover-bg: #4d0000;
        --breadcrumbs-bg: #1a1a1a;
        --breadcrumbs-link-color: #ff4d4d;
        --breadcrumbs-fg: #eee;
        --accent: #8b0000;
    }

    #header {
        background: var(--header-bg);
        color: var(--header-color);
        border-bottom: 3px solid var(--accent);
    }

    #header a:link, #header a:visited {
        color: var(--header-link-color);
    }

    div.breadcrumbs {
        background: var(--breadcrumbs-bg);
        color: var(--breadcrumbs-fg);
        border-bottom: 1px solid var(--accent);
    }

    .module h2, .module caption, .inline-group h2 {
        background: var(--accent);
        color: white;
    }

    .button, input[type=submit], input[type=button], .submit-row input, a.button {
        background: var(--button-bg);
    }

    .button:hover, input[type=submit]:hover, input[type=button]:hover, .submit-row input:hover, a.button:hover {
        background: var(--button-hover-bg);
    }

    .button.default, input[type=submit].default {
        background: #000000;
        border: 1px solid var(--accent);
    }

    .button.default:hover, input[type=submit].default:hover {
        background: var(--accent);
    }
    
    #content h1 {
        color: #1e293b;
        font-size: 1.375rem;
        font-weight: 600;
        border-bottom: 2px solid var(--accent);
        display: inline-block;
        padding-bottom: 5px;
        margin-bottom: 20px;
    }

    /* Content area: readable base type */
    body {
        font-size: 15px;
        line-height: 1.5;
        color: #1e293b;
    }

    #content {
        font-size: 15px;
        line-height: 1.5;
        color: #1e293b;
    }

    #content-main {
        font-size: 15px;
    }

    .form-row label,
    .aligned label {
        font-size: 14px;
        font-weight: 600;
        color: #334155;
    }

    .form-row .help,
    .aligned .help,
    p.help {
        font-size: 13px;
        line-height: 1.45;
        color: #475569;
    }

    #content input[type="text"],
    #content input[type="password"],
    #content input[type="email"],
    #content input[type="url"],
    #content input[type="number"],
    #content input[type="search"],
    #content textarea,
    #content select,
    #content .vTextField,
    #content .vLargeTextField,
    #content .vURLField,
    #content .vIntegerField {
        font-size: 15px !important;
        line-height: 1.45;
        color: #0f172a;
    }

    #content textarea {
        min-height: 6rem;
    }

    /* Changelist tables */
    #result_list thead th {
        font-size: 13px;
        font-weight: 600;
        color: #334155;
        padding: 10px 12px;
    }

    #result_list tbody td,
    #result_list tbody th {
        font-size: 14px;
        line-height: 1.45;
        color: #1e293b;
        padding: 10px 12px;
        vertical-align: middle;
    }

    #changelist-filter h2 {
        font-size: 13px;
    }

    #changelist-filter li {
        font-size: 13px;
        line-height: 1.4;
    }
</style>
{% endblock %}
